<!DOCTYPE html><html><head><meta charset="utf-8"><style>

      border-radius:228px;
      background:linear-gradient(160deg,#5b74ff 0%,#3a4fd9 48%,#2a37a8 100%);

  svg{position:absolute;inset:0}
</style></head><body>
<div class="sq"></div>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <g stroke="#fff" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- shank -->
    <path d="M512 296 V742"/>

    <path d="M262 566 C262 728 378 806 512 806 C646 806 762 728 762 566"/>

  <g fill="#fff">
    <path d="M262 512 l64 82 h-128 z"/>

</svg>
</body></html>
