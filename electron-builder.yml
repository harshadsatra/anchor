appId: com.harshadsatra.anchor
productName: Anchor
copyright: Copyright © 2026 Harshad Satra

directories:
  output: release
  buildResources: build

# electron-vite emits to out/; assets/ holds the tray icon, which main.js
# resolves at ../../assets relative to out/main.
files:
  - out/**/*
  - assets/**/*
  - package.json

mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  # Per-arch builds, NOT universal. A universal bundle carries two complete
  # Electron frameworks (484MB of a 489MB app) so every user downloads an
  # architecture they cannot run. Separate builds halve the download.
  # The zip target is dropped: it only exists to feed Squirrel auto-update,
  # which this app does not use, and it doubled every release upload.
  target:
    - target: dmg
      arch: [arm64, x64]
  # Ship one language. Electron bundles 109 .lproj dirs; this is a small win
  # (~1MB) but free.
  electronLanguages: [en-US]
  hardenedRuntime: true
  gatekeeperAssess: false
  # Ad-hoc sign ("-"). Without this electron-builder skips signing entirely
  # when there's no Developer ID, leaving the raw linker signature: the bundle
  # reports Identifier=Electron with an unbound Info.plist and no sealed
  # resources. macOS TCC keys Accessibility grants off the code signature, so
  # an unsigned bundle can never match a grant - the app re-prompts forever
  # and never sees any windows.
  identity: '-'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Menu-bar-only: no Dock icon, no app switcher entry. Set at the OS level
    # so there's no Dock flash before app.dock.hide() runs.
    LSUIElement: true
    # macOS shows this string in the Automation consent prompt. Without it the
    # prompt is suppressed and every AppleScript call fails silently.
    NSAppleEventsUsageDescription: >-
      Anchor uses System Events to list the open windows of running
      applications and bring the one you pick to the front.
    NSAccessibilityUsageDescription: >-
      Anchor needs Accessibility access to read window titles across apps and
      raise the window you select.

# Slower to build, smaller to download.
compression: maximum

dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

# Publishing is handled by .github/workflows/release.yml via
# softprops/action-gh-release, not by electron-builder. Its own publisher
# defaults to draft releases, which upload fine but stay invisible to everyone
# except the repo owner - it looks exactly like no .dmg was built.
publish: null
